<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signature Verification System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Signature Verification System</h1>
            <p>AI-powered handwritten signature authentication (English model)</p>
        </div>

        <div class="card">
            <div class="form-group">
                <label for="personSelect">Select Person ID</label>
                <select id="personSelect" class="form-control">
                    <option value="">-- Loading persons --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fileInput">Upload Signature Image</label>
                <div class="file-dropzone" id="fileDropzone">
                    <input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg" hidden>
                    <div class="dropzone-content">
                        <span class="upload-icon">📁</span>
                        <p>Drag & drop or click to upload</p>
                        <small>PNG, JPG (max 5MB)</small>
                    </div>
                </div>
                <div id="previewContainer" class="preview-container"></div>
            </div>

            <button id="verifyBtn" class="btn btn-primary" disabled>
                <span class="btn-text">Verify Signature</span>
                <span class="spinner hidden"></span>
            </button>

            <div id="resultContainer" class="result-container hidden">
                <div class="result-header">
                    <h3>Verification Result</h3>
                </div>
                <div id="resultContent"></div>
            </div>
        </div>

        <div class="info-footer">
            <p>⚡ Powered by TensorFlow & Hybrid Ensemble | Model trained on CEDAR55 dataset</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
